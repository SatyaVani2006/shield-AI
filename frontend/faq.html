<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHIELD AI | FAQ Training</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="grid-overlay" aria-hidden="true"></div>
  <div class="app-layout">
    <aside class="sidebar glass" style="border-radius:0;border-top:none;border-bottom:none;border-left:none;">
      <div class="sidebar-brand">
        <div class="logo-icon">SA</div>
        <div><h1>SHIELD AI</h1><span>Cyber Assistant</span></div>
      </div>
      <ul class="nav-links">
        <li><a href="dashboard.html">💬 Chat</a></li>
        <li><a href="faq.html" class="active">📚 FAQ Training</a></li>
        <li><a href="settings.html">⚙️ Settings</a></li>
      </ul>
      <button type="button" class="btn btn-ghost" id="logout-btn" style="width:100%;">Logout</button>
    </aside>
    <main class="main-content scrollable-content">
      <header class="page-header">
        <h2>My FAQ Contributions</h2>
        <p>Contribute custom questions to SHIELD AI's knowledge base. Your suggestions will be matched globally for all users, but only you can view and edit them here.</p>
      </header>
      <div id="faq-alert" class="alert hidden"></div>
      
      <form id="faq-form" class="faq-form glass">
        <input type="hidden" id="faq-edit-id" value="" />
        <div class="form-group">
          <label for="faq-question">Question</label>
          <input type="text" id="faq-question" required minlength="5" placeholder="e.g. What is double extortion ransomware?" />
        </div>
        <div class="form-group">
          <label for="faq-answer">Answer</label>
          <textarea id="faq-answer" rows="4" required minlength="5" placeholder="Explain the answer in clear security terms..."></textarea>
        </div>
        <div class="form-group">
          <label for="faq-category">Category</label>
          <select id="faq-category">
            <option value="general">General</option>
            <option value="password">Password</option>
            <option value="phishing">Phishing</option>
            <option value="malware">Malware</option>
            <option value="network">Network</option>
            <option value="awareness">Awareness</option>
            <option value="threats">Threats</option>
          </select>
        </div>
        <div class="form-group">
          <label for="faq-keywords">Keywords (comma-separated)</label>
          <input type="text" id="faq-keywords" placeholder="e.g. ransomware, extortion, malware" />
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button type="submit" class="btn btn-primary" id="faq-submit-btn">Add FAQ</button>
          <button type="button" class="btn btn-ghost hidden" id="faq-cancel-btn">Cancel Edit</button>
        </div>
      </form>

      <div class="faq-section-header" style="margin-top: 30px; margin-bottom: 15px;">
        <h3>My Submissions</h3>
      </div>
      <div class="faq-list" id="faq-list">
        <!-- User's submissions will load here dynamically -->
      </div>
    </main>
  </div>
  <script src="js/app.js"></script>
  <script src="js/faq-training.js"></script>
</body>
</html>
