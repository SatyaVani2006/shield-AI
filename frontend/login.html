<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHIELD AI | Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="grid-overlay" aria-hidden="true"></div>
  <div class="auth-container">
    <div class="auth-card glass">
      <div class="sidebar-brand" style="justify-content:center;border:none;margin-bottom:1rem;">
        <div class="logo-icon">SA</div>
      </div>
      <h2 id="auth-title">Sign In</h2>
      <p class="subtitle" id="auth-subtitle">Access your SHIELD AI security workspace</p>
      <div id="auth-alert" class="alert alert-error hidden" role="alert"></div>
      <form id="auth-form">
        <div class="form-group" id="username-group" style="display:none;">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" minlength="3" autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper" style="position: relative;">
            <input type="password" id="password" name="password" required minlength="6" autocomplete="current-password" style="padding-right: 46px;" />
            <button type="button" class="password-toggle-btn" id="password-toggle" aria-label="Toggle password visibility" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; padding: 0; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; height: 24px; width: 24px; transition: color 0.2s;">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width: 20px; height: 20px;" id="toggle-eye-icon">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
            </button>
          </div>
        </div>
        <div class="form-group" id="lang-group" style="display:none;">
          <label for="preferredLanguage">Preferred Language</label>
          <select id="preferredLanguage" name="preferredLanguage">
            <option value="en">English</option>
            <option value="hi">Hindi</option>
            <option value="te">Telugu</option>
            <option value="ta">Tamil</option>
            <option value="fr">French</option>
            <option value="es">Spanish</option>
            <option value="de">German</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;" id="auth-submit">Sign In</button>
      </form>
      <p class="auth-footer">
        <span id="toggle-text">Don't have an account?</span>
        <a href="#" id="toggle-auth">Register</a>
      </p>
      <p class="auth-footer"><a href="index.html">← Back to home</a></p>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
